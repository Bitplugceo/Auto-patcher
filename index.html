<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact card</title>
  <style>
    :root { --bg:#f6f7f8; --ink:#121212; --muted:#6d747e; --line:#e6e8ec; --btn:#111; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:560px; margin:0 auto; padding:48px 20px 64px; }
    h1 { font-size:40px; letter-spacing:-1px; line-height:1; }
    p { color:var(--muted); margin:12px 0 28px; }
    label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
    input { width:100%; border:1px solid var(--line); background:#fff; border-radius:12px; padding:14px; font:inherit; }
    button { width:100%; margin-top:18px; border:0; background:var(--btn); color:#fff; border-radius:999px; padding:14px; font-weight:700; font:inherit; }
    .note { margin-top:14px; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>Make a contact card.</h1>
    <p>Enter a number. The page builds a .vcf file you can save or send.</p>
    <form id="form">
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="Ada Cole" required>
      <label for="phone">Number</label>
      <input id="phone" name="phone" type="tel" placeholder="+1 415 555 0100" required>
      <label for="email">Email, optional</label>
      <input id="email" name="email" type="email" placeholder="ada@email.com">
      <button type="submit">Download .vcf</button>
    </form>
    <p class="note" id="note"></p>
  </main>
  <script>
    function esc(v) { return String(v).replace(/[\n\r]/g, " ").trim(); }
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = esc(document.getElementById("name").value);
      const phone = esc(document.getElementById("phone").value);
      const email = esc(document.getElementById("email").value);
      const lines = ["BEGIN:VCARD", "VERSION:3.0", "FN:" + name, "TEL;TYPE=CELL:" + phone];
      if (email) lines.push("EMAIL:" + email);
      lines.push("END:VCARD");
      const blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/vcard" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name.replace(/\s+/g, "-").toLowerCase() + ".vcf";
      a.click();
      URL.revokeObjectURL(a.href);
      document.getElementById("note").textContent = "Saved " + a.download;
    });
  </script>
</body>
</html>
