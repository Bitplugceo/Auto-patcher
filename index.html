<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wordwell</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --border: #30363d;
      --chip: #010409;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 22px 14px 36px;
    }
    .wrap { width: 100%; max-width: 680px; margin: 0 auto; }
    h1 { font-size: 24px; letter-spacing: -0.4px; text-align: center; }
    h1 span { color: #58a6ff; }
    p.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    button { border: none; cursor: pointer; font-weight: 700; }
    button:active { transform: scale(0.98); }
    .go {
      width: 100%;
      background: var(--accent);
      color: #04210c;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 16px;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .result-head span { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .copy {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 18px;
    }
    .copy.done { border-color: var(--accent); color: var(--accent); }
    #out {
      width: 100%;
      min-height: 140px;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 18px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }
    .status { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wordwell <span>Random</span></h1>
    <p class="sub">12 words. Short, long, then a run of six-letter words.</p>
    <div class="panel">
      <button class="go" id="gen" type="button">Generate</button>
    </div>
    <div class="panel">
      <div class="result-head">
        <span id="label">WORDS</span>
        <button class="copy" id="copy" type="button" aria-label="Copy words" title="Copy">📋</button>
      </div>
      <textarea id="out" readonly placeholder="sand animal fun physical panther marble  elegant resource inhale actual turkey engage"></textarea>
      <div class="status" id="status"></div>
    </div>
  </div>
<script>
const SLOTS = [
  { len: 4, kind: "noun" },
  { len: 6, kind: "noun" },
  { len: 3, kind: "any" },
  { len: 8, kind: "adj" },
  { len: 7, kind: "noun" },
  { len: 6, kind: "noun" },
  { len: 7, kind: "adj" },
  { len: 8, kind: "noun" },
  { len: 6, kind: "verb" },
  { len: 6, kind: "adj" },
  { len: 6, kind: "noun" },
  { len: 6, kind: "verb" }
];

const BANK = {
  noun: {
    3: ["bay","bee","elm","fox","ivy","oak","owl","rye","sap"],
    4: ["sand","rock","wolf","lion","hawk","leaf","pond","pine","moon","star","wind","fire","snow","rain","boat","bird","city","corn","deer","dove","duck","fish","frog","goat","gold","hill","iron","lake","lamp","milk","nest","path","pear","reed","rope","rose","seed","ship","silk","soil","toad","tree","vine","wave","wood","yard","barn","cave","clay","cove","dune","fern","foam","gulf","mist","moss","peak","reef","tide","vale","beam","bolt","cape","colt","fawn","grain","herd","isle","kelp","lark","loom","mare","mink","palm","quay","stem","twig"],
    6: ["animal","marble","turkey","garden","bridge","candle","meadow","window","mirror","pocket","pencil","market","bottle","shadow","orchid","island","rabbit","pebble","canyon","willow","spruce","timber","forest","flower","stream","valley","silver","copper","bronze","harbor","castle","temple","basket","button","circle","cotton","desert","dragon","engine","fabric","falcon","farmer","gravel","hammer","helmet","insect","jungle","kettle","kitten","lizard","magnet","mammal","mantle","meteor","monkey","muscle","needle","orange","oyster","palace","pepper","pigeon","planet","ribbon","salmon","sandal","shield","singer","spider","sponge","spring","square","statue","string","summer","throat","ticket","tissue","tomato","tongue","tunnel","turtle","vessel","violet","walnut","winter"],
    7: ["panther","harvest","balance","capital","chamber","climate","compass","crystal","diamond","dolphin","emerald","emperor","fortune","gallery","granite","hamster","harmony","horizon","jaguar","journey","lantern","leather","liberty","majesty","mineral","monarch","mystery","orchard","ostrich","peacock","penguin","phoenix","pioneer","prairie","pumpkin","pyramid","rainbow","reserve","sapphire","scholar","silence","sparrow","spinach","stadium","station","thunder","volcano","warrior","whisper","buffalo","cheetah","coconut","gazelle","giraffe","glacier","harbour","leopard","mammoth","meadows","nectar","pasture","penguin","trumpet"],
    8: ["resource","mountain","calendar","champion","chemical","crescent","elephant","festival","fortress","fountain","fracture","heritage","hospital","hurricane","industry","language","material","memorial","notebook","paradise","railroad","sandwich","skeleton","standard","strategy","strength","sunshine","surprise","symphony","treasure","tropical","twilight","umbrella","universe","wildlife","woodland","bachelor","campfire","cathedral","chestnut","daylight","dynamite","earthwax","gemstone","goldfish","iceberg","lavender","marble","necklace","painting","pavement","penguin","reindeer","seashell","snowball","starling","sunlight","tortoise","treasure","volcano"]
  },
  adj: {
    3: ["fun","odd","raw","shy","dry","hot","icy","new","old","red","sad","sly"],
    4: ["hard","bold","calm","cold","dark","fair","fine","firm","glad","kind","mild","neat","pale","rare","safe","soft","tall","wild","wise"],
    6: ["actual","bright","clever","gentle","golden","hidden","little","modern","narrow","quiet","simple","smooth","strong","tender","common","famous","honest","humble","lively","lonely","mighty","polite","proper","random","remote","silent","stable","steady","strict","subtle","superb","urgent","active","bitter","breezy","cheerful","cosmic","dainty","formal","frozen","gentle","global","honest","joyful","kindly","lovely","mellow","modest","noble","plucky","pretty","rugged","scenic","serene","sharp","sleepy","solemn","sunny","swift"],
    7: ["elegant","ancient","careful","certain","complex","distant","endless","ethical","extreme","fertile","fragile","generic","graceful","harmless","helpful","hopeful","intense","logical","massive","natural","obvious","patient","perfect","plastic","precise","private","radical","serious","sincere","slender","special","strange","supreme","tactile","visible","wealthy"],
    8: ["physical","absolute","abstract","abundant","accurate","adjacent","advanced","artistic","athletic","balanced","blatant","cheerful","chemical","colorful","complete","concrete","constant","creative","critical","delicate","distinct","dramatic","electric","enormous","faithful","flexible","generous","glorious","gorgeous","graceful","grateful","handsome","harmless","heavenly","honestly","humble","infinite","intimate","magnetic","majestic","ordinary","peaceful","pleasant","powerful","precious","rational","reliable","sensible","serious","splendid","stubborn","superior","tropical","ultimate","valuable","vertical","vigorous","wireless"]
  },
  verb: {
    3: ["run","see","try","win","ask","dig","fly","mix","owe","pay","sew","sit"],
    4: ["bake","bend","call","cook","draw","earn","fall","find","grow","hold","jump","keep","lift","make","open","pull","read","ride","save","seek","send","stay","swim","take","walk","wash","wish"],
    6: ["inhale","engage","accept","admire","arrive","attack","borrow","bounce","browse","change","choose","climb","create","decide","defend","design","expect","follow","gather","happen","invite","listen","manage","notice","obtain","prefer","remain","remove","repair","return","search","select","settle","travel","wonder","absorb","adjust","affirm","answer","appear","assist","attach","attain","attend","avoid","become","behave","belong","betray","bright","cancel","capture","carry","collect","commit","compare","compel","compile","comply","confer","confirm","connect","consist","contain","convey","create","debate","decide","defeat","defend","define","demand","depart","depend","derive","design","desire","detect","devote","direct","divide","donate","emerge","employ","enable","endure","enrich","enter","escape","exceed","expand","expect","expend","export","extend","fasten","finish","follow","forbid","forget","forgive","format","gather","govern","handle","happen","harden","hasten","ignite","imply","impose","improve","include","inform","inject","injure","insert","insist","intend","invent","invite","locate","manage","notice","obtain","occupy","oppose","orbit","pardon","permit","ponder","praise","prefer","prepare","prevent","proceed","produce","protect","provide","punish","pursue","reduce","refine","refuse","regard","reject","relate","relax","remain","remind","remove","render","repair","repeat","report","rescue","resist","resolve","restore","retain","retire","return","reveal","review","revise","reward","sample","search","secure","select","settle","soften","spring","strike","submit","suffer","supply","survey","switch","travel","tremble","unlock","update","vanish","wander","wonder"],
    7: ["achieve","advance","analyze","arrange","balance","believe","capture","collect","combine","command","compare","compose","conduct","confirm","connect","consist","contain","convert","declare","deliver","develop","discuss","display","examine","execute","explore","express","improve","include","inspect","install","observe","operate","perform","prepare","present","prevent","produce","protect","provide","publish","receive","recover","release","replace","require","resolve","respond","restore","support","suppose","survive"],
    8: ["absolute","approach","assemble","collapse","complete","consider","continue","decrease","describe","discover","displace","evaluate","generate","identify","increase","indicate","instruct","maintain","organize","persuade","practice","preserve","progress","propose","purchase","register","remember","represent","research","separate","simplify","surround","transfer","treasure","validate"]
  },
  any: {
    3: ["fun","sun","sea","oak","elm","fox","owl","bee","bay","mud","ice","sky","air","ash","ivy","rye","sap","dew","fog","log","map","nut","ore","rim","wax","odd","raw","shy","dry","hot","new","old","red","run","see","try","win","ask","dig","fly"]
  }
};

function unique(list) {
  return [...new Set(list)];
}
for (const kind of Object.keys(BANK)) {
  for (const len of Object.keys(BANK[kind])) BANK[kind][len] = unique(BANK[kind][len]);
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let lastKey = "";

function wordsFor(slot) {
  const bag = BANK[slot.kind] && BANK[slot.kind][slot.len];
  if (bag && bag.length) return bag;
  return BANK.any[slot.len] || BANK.noun[slot.len] || [];
}

function generate() {
  let out = [];
  for (let attempt = 0; attempt < 50; attempt++) {
    const used = new Set();
    out = [];
    let ok = true;
    for (const slot of SLOTS) {
      const choices = wordsFor(slot).filter(w => !used.has(w) && w.length === slot.len);
      if (!choices.length) { ok = false; break; }
      const w = pick(choices);
      used.add(w);
      out.push(w);
    }
    const key = out.join("\0");
    if (ok && out.length === 12 && key !== lastKey) break;
  }
  lastKey = out.join("\0");
  const line = out.slice(0, 6).join(" ") + "  " + out.slice(6).join(" ");
  document.getElementById("out").value = line;
  document.getElementById("label").textContent = "12 WORDS";
  document.getElementById("status").textContent = "New set. A word may return later, the line will not.";
  document.getElementById("copy").classList.remove("done");
}

async function copyWords() {
  const text = document.getElementById("out").value.trim();
  const status = document.getElementById("status");
  if (!text) {
    status.textContent = "Generate first.";
    return;
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else {
      const box = document.getElementById("out");
      box.focus();
      box.select();
      document.execCommand("copy");
    }
    document.getElementById("copy").classList.add("done");
    status.textContent = "Copied.";
  } catch (err) {
    status.textContent = "Copy failed. Select the words and copy manually.";
  }
}

document.getElementById("gen").addEventListener("click", generate);
document.getElementById("copy").addEventListener("click", copyWords);
</script>
</body>
</html>
