<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wordwell — Random Words</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --blue: #58a6ff;
      --border: #30363d;
      --warn: #d29922;
      --chip: #010409;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .wrap { width: 100%; max-width: 760px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    header h1 { font-size: 26px; letter-spacing: -0.4px; }
    header h1 span { color: var(--blue); }
    header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    label.field { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
    select, input[type="number"], input[type="text"] {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      outline: none;
      width: 100%;
    }
    select:focus, input:focus { border-color: var(--blue); }
    .checks { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--text); }
    .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .actions { display: flex; gap: 8px; margin-bottom: 12px; }
    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
    }
    button:active { transform: scale(0.98); }
    .go { flex: 1.4; background: var(--accent); color: #04210c; padding: 14px; }
    .alt { flex: 1; background: #21262d; color: var(--text); border: 1px solid var(--border); padding: 14px; }
    .alt.on { background: rgba(210,153,34,.18); color: var(--warn); border-color: rgba(210,153,34,.5); }
    .tools { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    .sm {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
    }
    .status {
      display: none;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .ok { display: block; background: rgba(63,185,80,.12); color: var(--accent); border: 1px solid rgba(63,185,80,.35); }
    .bad { display: block; background: rgba(248,81,73,.12); color: #f85149; border: 1px solid rgba(248,81,73,.35); }
    .stream {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 120px;
      align-content: flex-start;
    }
    .word {
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
    }
    .word:hover, .word:focus { border-color: var(--blue); outline: none; }
    .word small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .empty { color: var(--muted); font-size: 14px; padding: 18px 4px; }
    .hero {
      font-size: 34px;
      font-weight: 750;
      letter-spacing: -0.6px;
      text-align: center;
      padding: 8px 4px 14px;
      word-break: break-word;
    }
    .hero button {
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Wordwell <span>Random</span></h1>
      <p>Real words from a built-in bank, or new ones invented on the spot. Works offline.</p>
    </header>

    <div class="panel">
      <div class="hero"><button id="hero" type="button" title="Copy this word">tap generate</button></div>
      <div class="row">
        <label class="field">Source
          <select id="source">
            <option value="any">Any real word</option>
            <option value="noun">Nouns</option>
            <option value="verb">Verbs</option>
            <option value="adj">Adjectives</option>
            <option value="nature">Nature</option>
            <option value="invented">Invented (unlimited)</option>
            <option value="mix">Mix real + invented</option>
          </select>
        </label>
        <label class="field">How many
          <input id="count" type="number" min="1" max="200" value="12">
        </label>
        <label class="field">Min letters
          <input id="minLen" type="number" min="2" max="16" value="3">
        </label>
        <label class="field">Max letters
          <input id="maxLen" type="number" min="2" max="16" value="10">
        </label>
        <label class="field">Starts with
          <input id="starts" type="text" maxlength="3" placeholder="any" autocomplete="off">
        </label>
      </div>
      <div class="checks">
        <label><input id="unique" type="checkbox" checked> No repeats in this batch</label>
        <label><input id="cap" type="checkbox"> Capitalize</label>
        <label>Every <input id="every" type="number" min="1" max="30" value="2" style="width:64px;display:inline-block;padding:6px 8px"> s while always-on</label>
      </div>
    </div>

    <div class="actions">
      <button class="go" id="gen" type="button">Generate</button>
      <button class="alt" id="always" type="button">Always on</button>
    </div>
    <div class="tools">
      <button class="sm" id="copyAll" type="button">Copy all</button>
      <button class="sm" id="download" type="button">Download</button>
      <button class="sm" id="clear" type="button">Clear</button>
    </div>
    <div id="status" class="status" role="status"></div>

    <div class="panel">
      <div class="meta"><span id="countLabel">0 words</span><span>Tap a word to copy it</span></div>
      <div id="stream" class="stream"><div class="empty">Nothing yet. Generate a batch, or turn Always on and leave it running.</div></div>
    </div>
  </div>

<script>
const WORDS = {
  noun: `apple arch atom badge basin bead bench bird blade boat book bowl branch bread brick bridge broom bucket cabin cake camp candle canoe card cart cedar chain chair chalk chest city clock cloud coast coin comet coral corn cottage crane creek crown cup daisy desk door dove drum dune dust eagle earth ember engine farm feather fence field fire fish flame floor flower fog forest fork frost fruit garden gate glass glove grain grape grass harbor hawk hill honey hook horse house island ivy jar juice kettle key kite lake lamp leaf lemon light linen lion loaf lock maple market mask meadow metal milk mirror moon moss mountain mouse mouth nest night ocean olive orchard otter owl paint paper path pearl pen pencil pine plant pocket pond rain river road rock roof room root rope rose salt sand sea seed shadow sheep shell ship shoe shore silk silver smoke snow soil song spark spoon spring star stone storm stream street sun table tea tent thread tide tiger timber tool town tree valley village vine water wave wheat wind window wolf wood wool yard yarn`.split(" "),
  verb: `adapt agree arrive ask bake begin believe bend bind blend boil borrow build burn call carry catch change chase choose clean climb close collect cook copy count cover create cross cut dance decide deliver design dig discover draw drink drive drop earn eat enter examine explain fall feed fill find finish fix fly fold follow forget gather give grow guess guide hang hear help hide hold hope hunt hurry invent join jump keep kick knit know laugh lead learn leave lift listen live look lose love make manage march mark measure meet melt mend miss mix move name notice open pack paint pass pay pick place plan plant play point pour press pull push read remember repair return ride rise roll run sail save say search see seek sell send serve sew shake share shine show sing sit sleep slide smile sort speak spend stand start stay steal stir stop study swim take teach tell think throw tie touch travel try turn visit wait walk want wash watch weave weigh win wish work write`.split(" "),
  adj: `able ancient angry arctic bold brave brief bright broad calm careful cheap clean clear clever close cold common cool curious damp dark deep dim dry early easy empty fair faint far fast fierce fine firm flat fresh full gentle giant glad golden grand great green happy hard harsh heavy hidden high hollow hot huge hungry icy keen kind large late light little lively local long loose loud low lucky mild modern narrow near neat new odd old open pale patient plain proud quick quiet rare raw ready red rich ripe rough round safe scarce sharp short shy silent silver simple slow small smart smooth soft solid sour spare steep still strange strong sweet tall tame tender thick thin tidy tiny tough true vast warm weak wet wide wild wise young`.split(" "),
  nature: `alder amber aspen aurora badger basil bay beaver birch bloom boulder brook canyon cedar cliff cloud coral coyote creek crocus dawn deer delta dune eagle eddy elm ember estuary falcon fern finch fir fjord flint fog fox frost glacier glen gorse granite grove gull harbor hawk hazel heron holly honey hornet iris ivy juniper kelp lagoon lark lava lichen lily lynx maple marsh meadow mink mist moss newt oak otter owl pebble pine pond poppy quail quartz rabbit rain raven reed ridge river robin sage seal sedge shale shore silt sparrow spruce stone storm stream summit swallow thistle thorn tide timber toad trail trout tulip tundra vale vine violet willow wind wolf wood yarrow`.split(" ")
};

const ONSETS = ["b","br","c","ch","cl","cr","d","dr","f","fl","fr","g","gl","gr","h","j","k","l","m","n","p","pl","pr","qu","r","s","sh","sk","sl","sm","sn","sp","st","sw","t","tr","v","w","y","z","bl","th"];
const NUCLEI = ["a","e","i","o","u","ai","ea","ee","oa","oo","ou"];
const CODAS = ["","b","d","f","g","k","l","m","n","p","r","s","t","x","nd","nt","ld","rk","st","sh","mp","lt"];

let words = [];
let timer = null;
let always = false;

function rand(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[rand(arr.length)]; }

function invent(minLen, maxLen) {
  let word = "";
  let guard = 0;
  while ((word.length < minLen || word.length > maxLen) && guard < 40) {
    const syllables = 2 + rand(3);
    word = "";
    for (let i = 0; i < syllables; i++) {
      word += pick(ONSETS) + pick(NUCLEI) + (i === syllables - 1 || Math.random() < 0.65 ? pick(CODAS) : "");
    }
    word = word.replace(/q(?!u)/g, "qu").replace(/(.)\1\1+/g, "$1$1");
    guard++;
  }
  if (word.length < minLen) word = (word + pick(NUCLEI) + pick(CODAS)).slice(0, maxLen);
  if (word.length > maxLen) word = word.slice(0, maxLen);
  return word;
}

function poolFor(source) {
  if (source === "noun" || source === "verb" || source === "adj" || source === "nature") return WORDS[source];
  if (source === "any") return [...WORDS.noun, ...WORDS.verb, ...WORDS.adj, ...WORDS.nature];
  return [];
}

function passes(word, minLen, maxLen, starts) {
  if (word.length < minLen || word.length > maxLen) return false;
  if (starts && !word.startsWith(starts)) return false;
  return true;
}

function format(word, cap) {
  return cap ? word.charAt(0).toUpperCase() + word.slice(1) : word;
}

function makeOne(opts, used) {
  const starts = opts.starts.toLowerCase();
  for (let i = 0; i < 80; i++) {
    let raw;
    let kind;
    if (opts.source === "invented" || (opts.source === "mix" && Math.random() < 0.45)) {
      raw = invent(opts.minLen, opts.maxLen);
      kind = "invented";
    } else {
      const pool = poolFor(opts.source === "mix" ? "any" : opts.source);
      raw = pick(pool);
      kind = opts.source === "mix" ? "real" : opts.source;
    }
    if (!passes(raw, opts.minLen, opts.maxLen, starts)) continue;
    if (opts.unique && used.has(raw)) continue;
    used.add(raw);
    return { text: format(raw, opts.cap), kind };
  }
  return null;
}

function readOpts() {
  const minLen = clamp(+$("#minLen").value, 2, 16);
  let maxLen = clamp(+$("#maxLen").value, 2, 16);
  if (maxLen < minLen) maxLen = minLen;
  return {
    source: $("#source").value,
    count: clamp(+$("#count").value, 1, 200),
    minLen,
    maxLen,
    starts: ($("#starts").value || "").trim().toLowerCase().slice(0, 3),
    unique: $("#unique").checked,
    cap: $("#cap").checked
  };
}

function clamp(n, a, b) { return Math.max(a, Math.min(b, Number.isFinite(n) ? n : a)); }
function $(id) { return document.getElementById(id); }

function generate(replace) {
  const opts = readOpts();
  const used = new Set(opts.unique && !replace ? words.map(w => w.text.toLowerCase()) : []);
  const batch = [];
  const target = replace ? opts.count : 1;
  for (let i = 0; i < target; i++) {
    const one = makeOne(opts, used);
    if (one) batch.push(one);
  }
  if (!batch.length) {
    show("No word matched those filters. Widen length or clear the starting letters.", false);
    return;
  }
  words = replace ? batch : batch.concat(words).slice(0, 300);
  $("#hero").textContent = words[0].text;
  render();
  show(replace ? `Generated ${batch.length} word${batch.length === 1 ? "" : "s"}.` : `Added ${batch[0].text}.`, true);
}

function render() {
  const stream = $("#stream");
  $("#countLabel").textContent = `${words.length} word${words.length === 1 ? "" : "s"}`;
  if (!words.length) {
    stream.innerHTML = '<div class="empty">Nothing yet. Generate a batch, or turn Always on and leave it running.</div>';
    $("#hero").textContent = "tap generate";
    return;
  }
  stream.innerHTML = "";
  for (const w of words) {
    const btn = document.createElement("button");
    btn.className = "word";
    btn.type = "button";
    btn.innerHTML = `${escapeHtml(w.text)}<small>${escapeHtml(w.kind)}</small>`;
    btn.addEventListener("click", () => copyText(w.text, `Copied ${w.text}`));
    stream.appendChild(btn);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&":"&", "<":"<", ">":">", '"':""" }[c]));
}

async function copyText(text, okMsg) {
  try {
    if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    show(okMsg, true);
  } catch {
    show("Copy failed. Select the word manually.", false);
  }
}

function show(msg, ok) {
  const el = $("#status");
  el.textContent = msg;
  el.className = "status " + (ok ? "ok" : "bad");
  clearTimeout(show._t);
  show._t = setTimeout(() => { el.className = "status"; }, 2200);
}

function setAlways(on) {
  always = on;
  $("#always").classList.toggle("on", on);
  $("#always").textContent = on ? "Stop" : "Always on";
  clearInterval(timer);
  timer = null;
  if (on) {
    generate(false);
    const every = clamp(+$("#every").value, 1, 30) * 1000;
    timer = setInterval(() => generate(false), every);
  }
}

$("#gen").addEventListener("click", () => generate(true));
$("#always").addEventListener("click", () => setAlways(!always));
$("#hero").addEventListener("click", () => {
  const t = $("#hero").textContent;
  if (t && t !== "tap generate") copyText(t, `Copied ${t}`);
});
$("#copyAll").addEventListener("click", () => {
  if (!words.length) return show("Nothing to copy yet.", false);
  copyText(words.map(w => w.text).join("\n"), "Copied the list.");
});
$("#download").addEventListener("click", () => {
  if (!words.length) return show("Nothing to download yet.", false);
  const blob = new Blob([words.map(w => w.text).join("\n") + "\n"], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "random-words.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
});
$("#clear").addEventListener("click", () => {
  words = [];
  render();
  show("Cleared.", true);
});
</script>
</body>
</html>
