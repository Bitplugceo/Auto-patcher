<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wordwell</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --border: #30363d;
      --chip: #010409;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 22px 14px 36px;
    }
    .wrap { width: 100%; max-width: 680px; margin: 0 auto; }
    h1 { font-size: 24px; letter-spacing: -0.4px; text-align: center; }
    h1 span { color: #58a6ff; }
    p.sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .top { display: flex; gap: 10px; align-items: end; }
    label { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
    input {
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      width: 100%;
    }
    button { border: none; cursor: pointer; font-weight: 700; }
    button:active { transform: scale(0.98); }
    .go {
      background: var(--accent);
      color: #04210c;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      min-width: 132px;
    }
    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .result-head span { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .copy {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 18px;
    }
    .copy.done { border-color: var(--accent); color: var(--accent); }
    #out {
      width: 100%;
      min-height: 140px;
      background: var(--chip);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 18px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }
    .status { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wordwell <span>Random</span></h1>
    <p class="sub">Each tap replaces the box with a different set of 12.</p>
    <div class="panel">
      <div class="top">
        <label>How many
          <input id="count" type="number" min="1" max="200" value="12">
        </label>
        <button class="go" id="gen" type="button">Generate</button>
      </div>
    </div>
    <div class="panel">
      <div class="result-head">
        <span id="label">WORDS</span>
        <button class="copy" id="copy" type="button" aria-label="Copy words" title="Copy">📋</button>
      </div>
      <textarea id="out" readonly placeholder="Generated words will show here, separated by spaces."></textarea>
      <div class="status" id="status"></div>
    </div>
  </div>
<script>
const WORDS = `sand elegant animal resource fun inhale hard actual harvest turkey marble engage expert physical cord river quiet garden silver bridge candle meadow window mirror pocket ladder orchard compass bottle shadow lantern village pencil market clock stone apple basin bead bench bird blade boat book bowl branch bread brick broom bucket cabin cake camp canoe card cart cedar chain chair chalk chest city cloud coast coin comet coral corn cottage crane creek crown cup daisy desk door dove drum dune dust eagle earth ember engine farm feather fence field fire fish flame floor flower fog forest fork frost fruit gate glass glove grain grape grass harbor hawk hill honey hook horse house island ivy jar juice kettle key kite lake lamp leaf lemon light linen lion loaf lock maple mask metal milk moon moss mountain mouse mouth nest night ocean olive otter owl paint paper path pearl pen pine plant pond rain road rock roof room root rope rose salt sea seed sheep shell ship shoe shore silk smoke snow soil song spark spoon spring star storm stream street sun table tea tent thread tide tiger timber tool town tree valley vine water wave wheat wind wolf wood wool yard yarn adapt agree arrive ask bake begin believe bend bind blend boil borrow build burn call carry catch change chase choose clean climb close collect cook copy count cover create cross cut dance decide deliver design dig discover draw drink drive drop earn eat enter examine explain fall feed fill find finish fix fly fold follow forget gather give grow guess guide hang hear help hide hold hope hunt hurry invent join jump keep kick knit know laugh lead learn leave lift listen live look lose love make manage march mark measure meet melt mend miss mix move name notice open pack pass pay pick place plan plant play point pour press pull push read remember repair return ride rise roll run sail save say search see seek sell send serve sew shake share shine show sing sit sleep slide smile sort speak spend stand start stay steal stir stop study swim take teach tell think throw tie touch travel try turn visit wait walk want wash watch weave weigh win wish work write able ancient angry arctic bold brave brief bright broad calm careful cheap clear clever cold common cool curious damp dark deep dim dry early easy empty fair faint far fast fierce fine firm flat fresh full gentle giant glad golden grand great green happy harsh heavy hidden high hollow hot huge hungry icy keen kind large late little lively local long loose loud low lucky mild modern narrow near neat new odd old pale patient plain proud quick rare raw ready red rich ripe rough round safe scarce sharp short shy silent simple slow small smart smooth soft solid sour spare steep still strange strong sweet tall tame tender thick thin tidy tiny tough true vast warm weak wet wide wild wise young alder amber aspen aurora badger basil bay beaver birch bloom boulder brook canyon cliff coyote crocus dawn deer delta eddy elm estuary falcon fern finch fir fjord flint fox glacier glen gorse granite grove gull hazel heron holly hornet iris juniper kelp lagoon lark lava lichen lily lynx marsh mink mist newt oak pebble poppy quail quartz rabbit raven reed ridge robin sage seal sedge shale silt sparrow spruce summit swallow thistle thorn toad trail trout tulip tundra vale violet willow yarrow`.split(/\s+/);

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

let lastKey = "";

function generate() {
  const n = Math.max(1, Math.min(200, parseInt(document.getElementById("count").value, 10) || 12));
  let out = [];
  for (let attempt = 0; attempt < 40; attempt++) {
    const used = new Set();
    out = [];
    let guard = 0;
    while (out.length < n && guard < n * 30) {
      const w = pick(WORDS);
      guard++;
      if (used.has(w)) continue;
      used.add(w);
      out.push(w);
    }
    const key = [...out].sort().join("\0");
    if (out.length === n && key !== lastKey) break;
  }
  lastKey = [...out].sort().join("\0");
  document.getElementById("out").value = out.join(" ");
  document.getElementById("label").textContent = out.length + " WORDS";
  document.getElementById("status").textContent = "New set. Earlier words can appear again.";
  document.getElementById("copy").classList.remove("done");
}

async function copyWords() {
  const text = document.getElementById("out").value.trim();
  const status = document.getElementById("status");
  if (!text) {
    status.textContent = "Generate first.";
    return;
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const box = document.getElementById("out");
      box.focus();
      box.select();
      document.execCommand("copy");
    }
    document.getElementById("copy").classList.add("done");
    status.textContent = "Copied.";
  } catch (err) {
    status.textContent = "Copy failed. Select the words and copy manually.";
  }
}

document.getElementById("gen").addEventListener("click", generate);
document.getElementById("copy").addEventListener("click", copyWords);
</script>
</body>
</html>
